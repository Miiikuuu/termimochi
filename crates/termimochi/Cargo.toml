[package]
name = "termimochi"
description = "A GTK/libadwaita workbench for accessible terminal palettes and Starship prompt design"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "termimochi"
path = "src/main.rs"

[dependencies]
adw.workspace = true
gtk.workspace = true
vte.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonc-parser = { version = "0.33.1", features = ["cst", "serde_json"] }
termimochi-core.workspace = true
unicode-segmentation = "1.12"
unicode-width = "0.2"
toml = "1.1.5"
toml_edit = "0.25"
tempfile = "3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
png = "0.18.1"
