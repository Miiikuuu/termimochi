[workspace]
members = [
    "crates/termimochi-core",
    "crates/termimochi-cli",
    "crates/termimochi",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["TermiMochi contributors"]
repository = "https://github.com/Miiikuuu/termimochi"

[workspace.dependencies]
termimochi-core = { path = "crates/termimochi-core" }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4", "gtk_v4_10"] }
vte = { package = "vte4", version = "0.10.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
